<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한자 연습장">
<meta name="theme-color" content="#f3efe7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>window.__PWA__ = true;</script>
<title>한자 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe7; --panel:#fbf9f4; --paper:#fffdf8; --ink:#25211c; --muted:#7b746a; --line:#e2dccf;
  --accent:#c4473a; --accent-soft:#f6e3df; --ok:#2f7d5b; --ok-soft:#e1f0e8;
  --grid:#e4a79e; --grid-soft:#f1cdc7;
  --kfont:"Klee One", "Hiragino Mincho ProN", serif;
  --ufont:"Noto Sans KR", -apple-system, system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ufont);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- home ---------- */
#home{flex:1;display:flex;flex-direction:column;min-height:0}
.home-head{padding:22px 28px 10px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.home-head h1{margin:0;font-family:var(--kfont);font-weight:600;font-size:34px;letter-spacing:.02em}
.home-head h1 small{font-family:var(--ufont);font-size:14px;font-weight:500;color:var(--muted);margin-left:10px;letter-spacing:0}
.badge{margin-left:auto;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
  padding:5px 10px;border-radius:999px;white-space:nowrap}
.badge.cloud{color:var(--ok);border-color:#bfdccc;background:var(--ok-soft)}
.badge.dev{color:#2c4fa3;border-color:#c5d1ec;background:#eaf0fb}
.store-opt{display:flex;flex-direction:column;gap:8px}
.sopt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff}
.sopt.on{border-color:var(--ink)}
.sopt b{display:block;font-size:15px;margin-bottom:2px}
.sopt span{font-size:13px;color:var(--muted);line-height:1.45}
.sopt .ic{font-size:22px;line-height:1}
.sopt:disabled{opacity:.45}
.backup{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.badge.warn{color:#9a5b00;border-color:#ecd3a8;background:#fbf1de}
.tabs{display:flex;gap:8px;padding:6px 28px 0;overflow-x:auto}
.tab{padding:10px 16px 9px;border-radius:12px 12px 0 0;background:transparent;color:var(--muted);font-weight:500;
  white-space:nowrap;border:1px solid transparent;border-bottom:0}
.tab b{font-family:var(--kfont);font-size:18px;margin-right:4px;color:inherit}
.tab .pr{display:block;font-size:11px;font-weight:400;margin-top:2px}
.tab.on{background:var(--panel);color:var(--ink);border-color:var(--line)}
.home-body{flex:1;min-height:0;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
.home-bar{display:flex;align-items:center;gap:10px;padding:14px 28px;flex-wrap:wrap}
.seg{display:inline-flex;background:#efeae0;border-radius:10px;padding:3px}
.seg button{padding:7px 13px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stat{font-size:14px;color:var(--muted)}
.stat strong{color:var(--ink);font-weight:700}
.btn{padding:9px 15px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:500}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px;white-space:nowrap}
.vsep{width:1px;height:26px;background:var(--line);margin:0 4px}
.spacer{flex:1}
.grid{flex:1;overflow-y:auto;padding:4px 28px 40px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.tile{position:relative;aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:12px;
  font-family:var(--kfont);font-size:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;line-height:1}
.tile .ko{font-family:var(--ufont);font-size:11px;color:var(--muted);line-height:1.1;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:active{transform:scale(.96)}
.tile .no{position:absolute;left:7px;top:5px;font-family:var(--ufont);font-size:10px;color:#b3ab9e}
.tile.w::after{content:"";position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tile.l{background:var(--ok-soft);border-color:#bfdccc}
.tile.x{box-shadow:inset 0 0 0 2px #efb6ae}
.tile.l::before{content:"✓";position:absolute;right:6px;bottom:3px;font-family:var(--ufont);font-size:12px;color:var(--ok);font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-size:15px}

/* ---------- practice ---------- */
#practice{flex:1;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px}
.iconbtn:active{background:#ece6da}
.iconbtn:disabled{opacity:.3}
.ttl{display:flex;align-items:baseline;gap:10px;min-width:0}
.ttl .k{font-family:var(--kfont);font-size:30px;font-weight:600;line-height:1}
.ttl .meta{font-size:13px;color:var(--muted);white-space:nowrap}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:6px 4px;padding:6px 12px;border-bottom:1px solid var(--line);
  background:var(--panel);flex-wrap:wrap}
.toolbar::-webkit-scrollbar{display:none}
.tgroup{display:flex;align-items:center;gap:4px;padding:0 6px;border-right:1px solid var(--line)}
.tgroup:last-child{border-right:0}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-width:48px;height:50px;padding:0 5px;border-radius:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.tool svg{width:22px;height:22px}
.tool.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.06)}
.tool .tip{position:absolute;bottom:4px;width:16px;height:3px;border-radius:2px;background:transparent}
.tool.on .tip{background:var(--cur)}
.sw{width:28px;height:28px;flex:none;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--ink)}
.size{display:flex;align-items:center;gap:8px;padding:0 4px}
.size input{width:90px;accent-color:var(--ink)}
.size .dot{width:26px;height:26px;display:grid;place-items:center}
.size .dot i{display:block;border-radius:50%;background:var(--ink)}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap}
.chk .lvl{padding:3px 8px;border-radius:999px;background:#ece6da;color:var(--ink);font-weight:600;font-size:11px}
.switch{width:38px;height:22px;border-radius:999px;background:#d9d2c5;position:relative;transition:.15s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}
.switch.on::after{left:18px}

.work{flex:1;min-height:0;display:flex}
.side{width:310px;flex:none;padding:16px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line);
  background:var(--panel);overflow-y:auto}
.model{position:relative;aspect-ratio:1;background:#fff;border:2px solid var(--grid);border-radius:6px;display:grid;place-items:center}
.model::before,.model::after{content:"";position:absolute;background:none}
.model::before{left:50%;top:0;bottom:0;border-left:1.5px dashed var(--grid-soft)}
.model::after{top:50%;left:0;right:0;border-top:1.5px dashed var(--grid-soft)}
.model span{position:relative;z-index:1;font-family:var(--kfont);font-weight:600;font-size:150px;line-height:1}
.model.hide span{visibility:hidden}
.model .cover{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kofull{text-align:center;font-size:17px;font-weight:700;margin-top:-4px}
.info{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.info .sec{position:relative}
.info .h{font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:6px}
.info .h em{font-style:normal;color:#b3ab9e}
.kseg{display:inline-flex;background:#efeae0;border-radius:7px;padding:2px;flex:none}
.kseg button{font-family:var(--kfont);font-size:12px;padding:3px 7px;border-radius:5px;color:var(--muted)}
.kseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.info .rd{display:flex;flex-wrap:wrap;gap:5px}
.info .rd span{font-family:var(--kfont);font-size:17px;font-weight:600;background:#f6f2ea;border-radius:6px;padding:2px 7px;line-height:1.35}
.info .rd span i{font-style:normal;color:#b0a797;font-weight:400}
.info .rd.on span{background:var(--accent-soft);color:#8f2f25}
.info .none{color:#b3ab9e;font-size:13px}
.info .w{font-family:var(--kfont);font-size:22px;font-weight:600;line-height:1.2}
.info .w small{font-family:var(--kfont);font-size:14px;color:var(--muted);font-weight:400;margin-left:6px}
.info .wk{color:var(--muted);font-size:13px;margin-top:2px}
.info .s{font-family:var(--kfont);font-size:17px;line-height:1.6}
.info .s b{color:var(--accent);font-weight:600}
.info .sk{color:#4a443c;font-size:14px;margin-top:4px;background:#f6f2ea;border-radius:6px;padding:5px 8px;line-height:1.45}
.info .wk{color:#4a443c}
.info .vwrap{position:relative;min-height:30px}
.info .veil{position:absolute;inset:0;background:repeating-linear-gradient(45deg,#f4efe6,#f4efe6 6px,#efe9de 6px,#efe9de 12px);
  border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);border:1px dashed #d9d0c0}
.info .sec.hidden .body{visibility:hidden}
.lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
.learn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px}
.learn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pages{display:flex;align-items:center;gap:6px}
.pages .pn{font-size:14px;min-width:54px;text-align:center}
.stage{flex:1;min-width:0;display:grid;place-items:center;padding:14px;position:relative}
.paper{position:relative;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 28px rgba(60,40,20,.10);border-radius:4px}
.paper svg,.paper canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.paper canvas{touch-action:none}
.paper .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;background:rgba(255,253,248,.7)}

@media (orientation:portrait){
  .work{flex-direction:column}
  .side{width:auto;flex-direction:row;align-items:stretch;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:16px;overflow-x:auto}
  .model{height:150px;width:150px;flex:none}
  .side .mcol{display:flex;flex-direction:column;gap:8px;flex:none;width:150px}
  .info{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1.3fr;gap:10px 18px;align-content:start}
  .side .mcol .mtext{align-items:center}
  .model span{font-size:110px}
  .side .col{display:flex;flex-direction:column;gap:10px;min-width:200px}
  .side .col .row{gap:4px 12px}
}
@media (orientation:landscape){
  .side .col{display:flex;flex-direction:column;gap:14px}
  .side .mcol{display:flex;align-items:center;gap:14px}
  .side .mcol .model{width:110px;flex:none}
  .side .mcol .model span{font-size:84px}
  .side .mcol .kofull{font-size:19px;text-align:left;margin:0}
  .side{gap:12px;padding:14px}
}
.right{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.right .stage{flex:1;min-height:0}
.pbar{display:flex;align-items:center;gap:8px 10px;padding:8px 14px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.pbar .plist{flex:1 1 100%;flex-wrap:wrap}
.pbar .spacer{display:none}
.pbar #pgDel{margin-left:auto}
.pbar::-webkit-scrollbar{display:none}
.plist{display:flex;gap:6px;flex:none}
.pitem.add{border:1.5px dashed #cfc5b4;color:var(--muted);font-weight:500}
.pitem.add .n{background:transparent;font-size:16px}
.addsel{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.albl{font-size:12px;color:var(--muted)}
.seg.dark button{padding:7px 12px;font-size:13px;white-space:nowrap}
.seg.dark button.on{background:var(--ink);color:#fff}
.mtext{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.lseg{display:flex}
.learnchk{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--muted);touch-action:manipulation;cursor:pointer}
.learnchk.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.learnchk .switch{flex:none;pointer-events:none}
.learnchk #learnTxt{pointer-events:none}
.lseg button{flex:1;min-height:42px;padding:8px 8px;font-size:14px;white-space:nowrap;cursor:pointer;touch-action:manipulation}
.lseg button.on[data-l="1"]{background:var(--ok);color:#fff}
.lseg button.on[data-l="0"]{background:#fff;color:var(--ink)}
.pitem{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 7px;border-radius:999px;border:1px solid var(--line);background:#f6f2ea;font-size:13px;white-space:nowrap;flex:none}
.pitem .n{width:22px;height:22px;border-radius:50%;background:#ece6da;display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
.pitem .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pitem.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.pitem.on .dot{background:#ffb4aa}
.pitem.on .n{background:#fff;color:var(--ink)}
.stage{touch-action:none}
.snav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:44px;height:72px;border-radius:12px;font-size:30px;color:var(--muted);left:6px;background:rgba(255,255,255,.55)}
.snav.r{left:auto;right:6px}
.snav:disabled{opacity:0;pointer-events:none}



/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(30,25,20,.35);display:grid;place-items:center;z-index:50}
.modal .box{background:#fff;border-radius:16px;padding:22px;width:min(340px,86vw);box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal p{margin:0 0 18px;font-size:15px;line-height:1.5}
.modal .row{justify-content:flex-end}
.btn.danger{background:var(--accent);border-color:var(--accent);color:#fff}
.modal .box.wide{width:min(560px,92vw)}
.modal h3{margin:0 0 14px;font-size:19px}
.modal .lbl{margin-top:12px}
.seg.qs{display:flex;flex-wrap:wrap}
.seg.qs button{flex:1;white-space:nowrap}
.qhint{font-size:13px;color:var(--muted);margin:8px 0 0!important;line-height:1.5}
#qsHint{margin:14px 0 16px!important}
#quiz{flex:1;display:flex;flex-direction:column;min-height:0}
.qscore{font-size:15px;font-weight:700}
.qbar{height:4px;background:#e7e0d3}
.qbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.qbody{flex:1;min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;align-items:center}
.qcard{width:min(720px,100%);display:flex;flex-direction:column;align-items:center;gap:16px}
.qask{font-size:15px;color:var(--muted)}
.qprompt{font-family:var(--kfont);font-weight:600;font-size:110px;line-height:1.1;text-align:center}
.qprompt.ko{font-family:var(--ufont);font-size:44px;font-weight:700}
.qprompt.word{font-size:84px}
.qprompt i{font-style:normal;color:#9d9486}
.qchoices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.qch{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 10px;font-family:var(--kfont);font-size:30px;font-weight:600;min-height:84px}
.qch.big{font-size:52px}
.qch:active{transform:scale(.98)}
.qch.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.qch.ng{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.qch:disabled{opacity:1}
.qexp{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:15px;line-height:1.7}
.qexp .kk{font-family:var(--kfont);font-size:30px;font-weight:600;margin-right:8px;vertical-align:middle}
.qexp .jp{font-family:var(--kfont);font-size:17px}
.qverdict{font-size:20px;font-weight:700}
.qverdict.ok{color:var(--ok)} .qverdict.ng{color:var(--accent)}
.qwrite{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center;width:100%}
.qcard.w{width:min(900px,100%)}
.qclue{display:flex;flex-direction:column;gap:10px;width:300px;flex:none}
.qclue .qexp{font-size:13px;line-height:1.6;padding:10px 12px}
.qclue .qexp .kk{font-size:24px}
.qover{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kfont);font-weight:600;color:#c4473a;opacity:.28;line-height:1;pointer-events:none;z-index:2}
.qclue .ko{font-size:34px;font-weight:700}
.qclue .wd{font-family:var(--kfont);font-size:30px;font-weight:600}
.qclue .wd small{font-size:16px;color:var(--muted);font-weight:400;margin-left:6px}
.qclue .sk{color:var(--muted);font-size:14px;line-height:1.5}
.qpadwrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.qpad{position:relative;background:var(--paper);border:3px solid var(--grid);border-radius:6px;box-shadow:0 6px 20px rgba(60,40,20,.08)}
.qpad::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--grid-soft)}
.qpad::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:2px dashed var(--grid-soft)}
.qpad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
.qans{font-family:var(--kfont);font-weight:600;font-size:150px;line-height:1;text-align:center}
.qres{width:min(720px,100%);display:flex;flex-direction:column;align-items:center;gap:18px}
.qres .big{font-size:56px;font-weight:700}
.qres .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;width:100%}
.qres .t{position:relative;aspect-ratio:1;background:#fff;border:2px solid var(--line);border-radius:12px;font-family:var(--kfont);font-size:34px;display:grid;place-items:center}
.qres .t.ok{border-color:#bfdccc;background:var(--ok-soft)}
.qres .t.ng{border-color:#efb6ae;background:var(--accent-soft)}
.qres .t span{position:absolute;right:6px;top:3px;font-family:var(--ufont);font-size:12px;font-weight:700}

const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open("kanji-renshu", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  req(mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction("kv", mode), st = tx.objectStore("kv"), r = fn(st);
      tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || { code: "quota_exceeded" });
    });
  },
  get(k) { return this.req("readonly", st => st.get(k)).then(v => v === undefined ? null : v); },
  set(k, v) { return this.req("readwrite", st => v === null ? st.delete(k) : st.put(v, k)); },
  async all() {
    const keys = await this.req("readonly", st => st.getAllKeys()), vals = await this.req("readonly", st => st.getAll());
    const out = {}; keys.forEach((k, i) => out[k] = vals[i]); return out;
  }
};
const Store = {
  mode: "loading", db: null, uid: null, cloudOK: false, deviceOK: false,
  where() { return lsGet("kj:where", "cloud"); },
  async init() {
    try { await IDB.open(); this.deviceOK = true; } catch (e) { this.deviceOK = false; }
    try {
      for (let i = 0; i < 20 && !(window.claude && window.claude.use); i++) await sleep(100);
      if (window.claude && window.claude.use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db && user) { const id = await user.id(); if (id) { this.db = db; this.uid = String(id); this.cloudOK = true; } }
      }
    } catch (e) { /* fall through */ }
    const pref = this.where();
    if (pref === "device" && this.deviceOK) this.mode = "device";
    else if (this.cloudOK) this.mode = "cloud";
    else if (this.deviceOK) this.mode = "device";
    else this.mode = lsSet("kj:probe", 1) ? "local" : "none";
  },
  ref(key) { return this.db.collection("data/users/" + this.uid).doc(key); },
  async get(key, mode = this.mode) {
    if (mode === "cloud") {
      try {
        const s = await withTimeout(this.ref(key).get(), 10000);
        return s.exists ? s.data() : null;
      } catch (e) {
        if (e && e.code === "unavailable") { await sleep(400 + Math.random() * 600); const s = await withTimeout(this.ref(key).get(), 10000); return s.exists ? s.data() : null; }
        throw e;
      }
    }
    if (mode === "device") return IDB.get(key);
    if (mode === "local") return lsGet("kj:" + key, null);
    return null;
  },
  async set(key, val, mode = this.mode) {
    if (mode === "cloud") {
      const r = this.ref(key);
      const op = () => val === null ? r.delete() : r.set(val);
      try { await op(); }
      catch (e) { if (e && e.code === "unavailable") { await sleep(500 + Math.random() * 800); await op(); } else throw e; }
      return;
    }
    if (mode === "device") { try { await IDB.set(key, val); } catch (e) { throw { code: "quota_exceeded" }; } return; }
    if (mode === "local") {
      if (val === null) { try { localStorage.removeItem("kj:" + key); } catch (e) {} return; }
      if (!lsSet("kj:" + key, val)) throw { code: "quota_exceeded" };
    }
  },
  async all(mode = this.mode) {
    if (mode === "cloud") {
      const snap = await withTimeout(this.db.collection("data/users/" + this.uid).get(), 20000);
      const out = {}; snap.docs.forEach(d => { if (d.exists) out[d.id] = d.data(); }); return out;
    }
    if (mode === "device") return IDB.all();
    const out = {};
    if (mode === "local") for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); if (k && (k === "kj:meta" || k.startsWith("kj:p_"))) out[k.slice(3)] = lsGet(k, null);
    }
    return out;
  }
};

/* one write at a time per document, coalescing bursts */
const Writer = {
  pending: new Map(), busy: new Set(),
  put(key, val) { this.pending.set(key, val); setStatus("saving"); this.pump(key); },
  async pump(key) {
    if (this.busy.has(key) || !this.pending.has(key)) return;
    const val = this.pending.get(key); this.pending.delete(key); this.busy.add(key);
    let failed = null;
    try { await Store.set(key, val); } catch (e) { failed = e || {}; }
    this.busy.delete(key);
    if (failed) {
      if (!this.pending.has(key)) this.pending.set(key, val);
      if (failed.code === "quota_exceeded") toast("저장 공간이 가득 찼어요. 쓰지 않는 페이지를 지워 주세요.", 4500);
      setStatus("error");
      setTimeout(() => this.pump(key), 6000);
      return;
    }
    if (this.pending.has(key)) this.pump(key);
    else if (!this.busy.size && !this.pending.size) setStatus("saved");
  },
  idle() { return !this.busy.size && !this.pending.size; }
};

function setStatus(s) {
  const el = $("saveStatus");
  el.classList.toggle("err", s === "error");
  if (Store.mode === "none") { el.textContent = "저장 안 됨"; el.classList.add("err"); return; }
  el.textContent = s === "saving" ? "저장 중…" : s === "error" ? "저장 실패 · 다시 시도 중" :
    s === "saved" ? (Store.mode === "cloud" ? "계정에 저장됨 ✓" : "아이패드에 저장됨 ✓") : "";
}

function encodePts(pts) {
  const out = []; let px = 0, py = 0, pp = 0;
  for (let i = 0; i < pts.length; i += 3) {
    const x = Math.round(pts[i] * 10), y = Math.round(pts[i + 1] * 10), p = Math.round(pts[i + 2] * 100);
    out.push(x - px, y - py, p - pp); px = x; py = y; pp = p;
  }
  return out.join(",");
}
function decodePts(s) {
  if (!s) return [];
  const a = s.split(",").map(Number), out = new Array(a.length); let x = 0, y = 0, p = 0;
  for (let i = 0; i + 2 < a.length; i += 3) { x += a[i]; y += a[i + 1]; p += a[i + 2]; out[i] = x / 10; out[i + 1] = y / 10; out[i + 2] = p / 100; }
  return out;
}
function serPage(pg) { return { paper: pg.paper, s: pg.strokes.map(st => ({ k: st.k, c: st.c, w: st.w, d: encodePts(st.pts) })), t: Date.now() }; }

function paperSVG() {

  const hide = P.test, trace = settings.trace && !hide;
  const G = "#e4a79e", GS = "#f1cdc7";
  let s = "";
  const boxGrid = (pad, cell, n, fs, texts) => {
    const end = pad + cell * n;
    for (let i = 0; i <= n; i++) {
      const v = pad + i * cell;
      s += `<line x1="${pad}" y1="${v}" x2="${end}" y2="${v}" stroke="${G}" stroke-width="${i % n === 0 ? 3 : 2}"/>`;
      s += `<line x1="${v}" y1="${pad}" x2="${v}" y2="${end}" stroke="${G}" stroke-width="${i % n === 0 ? 3 : 2}"/>`;
    }
    for (let i = 0; i < n; i++) {
      const m = pad + i * cell + cell / 2;
      s += `<line x1="${pad}" y1="${m}" x2="${end}" y2="${m}" stroke="${GS}" stroke-width="1.6" stroke-dasharray="8 7"/>`;
      s += `<line x1="${m}" y1="${pad}" x2="${m}" y2="${end}" stroke="${GS}" stroke-width="1.6" stroke-dasharray="8 7"/>`;
    }
    texts.forEach(([col, row, op]) => {
      const cx = pad + col * cell + cell / 2, cy = pad + row * cell + cell / 2;
      s += `<text x="${cx}" y="${cy}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" font-family="Klee One, serif" font-weight="600" fill="#25211c" fill-opacity="${op}">${ch}</text>`;
    });
  };
  if (type === "grid") {

  cv.onpointerdown = ev => {
    if (pad.cur || (ev.pointerType === "touch" && settings.pencilOnly)) return;
    ev.preventDefault(); try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    r = cv.getBoundingClientRect(); pad.cur = { k: "brush", c: "#1d1b18", w: 22, pts: [], id: ev.pointerId }; add(ev); draw();
  };
  cv.onpointermove = ev => {
    if (!pad.cur || ev.pointerId !== pad.cur.id) return;
    const l = ev.getCoalescedEvents ? ev.getCoalescedEvents() : []; (l.length ? l : [ev]).forEach(add); draw();
  };
  cv.onpointerup = cv.onpointercancel = ev => { if (!pad.cur || ev.pointerId !== pad.cur.id) return; pad.strokes.push(pad.cur); pad.cur = null; draw(); };
  cv.addEventListener("touchstart", e => { if (e.touches[0] && e.touches[0].touchType === "stylus") e.preventDefault(); }, { passive: false });
  $("qUndo").onclick = () => { pad.strokes.pop(); draw(); };
  $("qClear").onclick = () => { pad.strokes = []; draw(); };
}
function renderResult() {
  $("qProg").style.width = "100%";
  const wrong = Q.items.filter(q => !q.ok), right = Q.items.filter(q => q.ok);
  $("qBody").innerHTML = `<div class="qres"><div class="qask">${Q.grade}학년 ${Q.type === "read" ? "읽기 퀴즈" : "쓰기 시험"} 결과</div>
    <div class="big">${Q.ok} / ${Q.items.length}</div>
    <div class="grid2">${Q.items.map(q => `<button class="t ${q.ok ? "ok" : "ng"}" data-hex="${q.it.hex}"><span>${q.ok ? "⭕" : "❌"}</span>${q.it.c}</button>`).join("")}</div>
    <div class="qask">글자를 누르면 그 한자 연습장으로 가요.</div>
    <div class="row" style="justify-content:center">
      ${wrong.length ? `<button class="btn primary" id="qRetry">틀린 ${wrong.length}자 다시 풀기</button>` : ""}
      ${right.length ? `<button class="btn" id="qLearn">맞은 ${right.length}자 '외웠어요' 표시</button>` : ""}
      <button class="btn" id="qHome">목록으로</button></div></div>`;
  $("qBody").querySelector(".grid2").addEventListener("click", e => { const b = e.target.closest("[data-hex]"); if (b) location.hash = "k-" + b.dataset.hex; });
  if (wrong.length) $("qRetry").onclick = () => startQuiz(Q.type, shuffle(wrong.map(q => q.it)));
  if (right.length) $("qLearn").onclick = () => { right.forEach(q => meta.l[q.it.hex] = 1); saveMeta(); toast(`${right.length}자를 외운 글자로 표시했어요`); $("qLearn").disabled = true; };
  $("qHome").onclick = () => { Q = null; location.hash = "g" + settings.grade; };
}
$("qBack").addEventListener("click", async () => {
  if (Q && Q.i < Q.items.length && Q.i > 0 && !(await ask("테스트를 그만둘까요? 지금까지 푼 결과는 틀린 글자 기록에 남아요.", "그만두기"))) return;
  Q = null; location.hash = "g" + settings.grade;
});

/* ================= routing ================= */
function route() {
  const h = (location.hash || "").slice(1);
  const mk = /^k-([0-9a-f]+)$/.exec(h), mg = /^g([1-6])$/.exec(h);
  $("quiz").hidden = true;
  if (mk && BY_HEX[mk[1]]) { openKanji(mk[1]); return; }
  if (saveTimer) flush();
  if (h === "quiz" && Q) { P.item = null; P.loadToken++; $("practice").hidden = true; $("home").hidden = true; $("quiz").hidden = false; renderQuiz(); return; }
  P.item = null; P.loadToken++;
  if (mg) { settings.grade = mg[1]; saveSettings(); }
  $("practice").hidden = true; $("home").hidden = false;
  renderHome();
}
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", e => { if (saveTimer) flush(); if (!Writer.idle()) { e.preventDefault(); e.returnValue = ""; } });

/* ================= boot ================= */
buildToolbar(); syncToolbar(); renderBadge();
const ready = (async () => {
  await Store.init(); renderBadge();
  if (Store.mode === "none") { toast("이 환경에서는 저장이 안 돼요. Safari에서 열어 주세요.", 5000); return; }
  try {
    const m = await Store.get("meta");
    if (m) meta = { w: m.w || {}, l: m.l || {}, x: m.x || {} };
  } catch (e) { toast("기록을 불러오지 못했어요. 잠시 후 새로 열어 주세요.", 4500); }
  if (!$("home").hidden) renderHome();
  else if (P.item) { syncLearn(); }
})();
route();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!$("home").hidden) renderGrid(); });
})();
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
